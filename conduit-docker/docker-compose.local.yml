services:
  conduit-postgres:
    image: postgres:18.3
    container_name: conduit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-conduit}
      POSTGRES_USER: ${DATABASE_USER:-conduit}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-conduit_local}
    volumes:
      - conduit-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  conduit-backend:
    build:
      context: ../conduit-backend
      dockerfile: ../conduit-docker/conduit-backend/Dockerfile
    image: conduit-backend:local
    container_name: conduit-backend
    restart: unless-stopped
    depends_on:
      conduit-postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_HOST: conduit-postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-conduit}
      DATABASE_USER: ${DATABASE_USER:-conduit}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-conduit_local}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to at least 32 characters}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-720}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  conduit-postgres-data:
