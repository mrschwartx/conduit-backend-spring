services:
  conduit-postgres:
    image: postgres:18.3
    container_name: conduit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-conduit}
      POSTGRES_USER: ${DB_USER:-conduit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-S9p!tBox_2026@Db}
    ports:
      - "5432:5432"
    volumes:
      - conduit-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  conduit-backend:

volumes:
  conduit-postgres-data: