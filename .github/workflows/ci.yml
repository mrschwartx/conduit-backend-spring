name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conduit commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  conduit-backend-quality:
    name: Conduit backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: conduit-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: conduit-backend/pom.xml
      - name: Make wrapper executable
        run: chmod +x mvnw
      - name: Unit and integration tests
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: conduit-backend/target/surefire-reports
          retention-days: 7

  conduit-backend-build:
    name: Conduit backend build
    runs-on: ubuntu-latest
    needs: conduit-backend-quality
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conduit-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: conduit-backend/pom.xml
      - name: Make wrapper executable
        run: chmod +x mvnw
      - name: Package
        run: ./mvnw -B -DskipTests package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: conduit-backend-jar
          path: conduit-backend/target/conduit-backend-*.jar
          retention-days: 7

  conduit-docker:
    name: Conduit docker container
    runs-on: ubuntu-latest
    needs: conduit-backend-quality
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-secret-0123456789-abcdefghijklmnop
      PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: conduit-backend
          file: conduit-docker/conduit-backend/Dockerfile
          load: true
          tags: conduit-backend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack
        run: docker compose -f conduit-docker/docker-compose.local.yml up -d
      - name: Wait for health check
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/health | grep -q OK; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f conduit-docker/docker-compose.local.yml logs
          exit 1
      - name: Check endpoints
        run: |
          curl -fsS http://localhost:8080/api/v1/tags
          curl -fsS http://localhost:8080/api/v1/articles
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/articles/feed)
          test "$status" = "401"
      - name: Show logs on failure
        if: failure()
        run: docker compose -f conduit-docker/docker-compose.local.yml logs
      - name: Stop stack
        if: always()
        run: docker compose -f conduit-docker/docker-compose.local.yml down -v
