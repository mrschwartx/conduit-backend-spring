spring:
  application:
    name: conduit-backend
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:conduit_dev}
    username: ${DATABASE_USER:dev_user}
    password: ${DATABASE_PASSWORD:dev_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

logging:
  structured:
    format:
      console: logstash # JSON on stdout; MDC (requestId) and key/value pairs are included
  level:
    root: ${LOG_LEVEL:info}

conduit:
  jwt-secret: ${JWT_SECRET:}            # required, >= 32 chars; startup fails otherwise
  jwt-ttl-minutes: ${JWT_TTL_MINUTES:720}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  max-body-bytes: 1048576

# Swagger UI is only a viewer for the real contract (openapi.yml, copied into the
# classpath at build time). springdoc's own generated docs are disabled so that
# there is never a second, code-derived contract.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi.yml
    path: /swagger-ui.html
